# Такт конвейера: приемка и публикация.
#
# Кладется в репозиторий foxlik-pipeline как .github/workflows/tick.yml
#
# 🔴 Раз в 5 минут - решение владельца 27.08. Причина: при получасовом такте человек
# нажимает кнопку приемки и полчаса не видит отклика, то есть каждый раз считает,
# что сломалось. Проверено на живом человеке в тот же день.
#
# 🔴 ПОЧЕМУ ЗДЕСЬ ЦЕПОЧКА, А НЕ ПРОСТО CRON. Замер 28.08 в 10:06 UTC: расписание
# `*/5` дало **1 запуск вместо ожидаемых ~223** за 18,6 часов, а суточный cron
# метрик пропустил свой срок вовсе. Отключения не было: оба workflow active,
# ветка main, репозиторий публичный, не форк. Дока GitHub такое допускает дословно:
#   "The `schedule` event can be delayed during periods of high loads ... If the load
#    is sufficiently high enough, some queued jobs may be dropped."
# То есть cron - не обещание, а пожелание. Пятиминутный такт на нем не живет.
#
# 🔴 КАК ДЕРЖИМ ТАКТ. Один запуск делает 11 тактов подряд с паузой 5 минут внутри
# себя (это ~57 минут работы), а последним шагом дергает следующий запуск через
# `workflow_dispatch`. Дока разрешает это встроенным токеном:
#   "events triggered by the `GITHUB_TOKEN` will not create a new workflow run, with
#    the following exceptions: `workflow_dispatch` and `repository_dispatch` events
#    always create workflow runs."
# Личный токен (PAT) не нужен - это была первая догадка, замер по доке ее отменил.
#
# 🔴 CRON ОСТАВЛЕН СТРАХОВКОЙ. Он не несущий: его дело - поднять цепочку, если
# она порвалась (job отменили, раннер умер). Пусть срабатывает редко и криво -
# для подъема раз в сутки этого хватит, а для такта у нас теперь эстафета.
#
# 🔴 ВЫКЛЮЧАТЕЛЬ. Цепочка сама себя воспроизводит, остановить ее кнопкой «отменить
# запуск» нельзя - следующее звено уже создано. Останавливать так:
#     gh workflow disable tick.yml --repo Vladfoxlik/foxlik-pipeline
# У отключенного workflow эстафета не сработает, и цепочка гаснет. Обратно -
# `gh workflow enable` и один `gh workflow run`.
#
# 🔴 Следствие публичности: **логи запусков видны любому.** Поэтому tick.py пишет
# в лог только номера строк и статусы, без названий роликов и тел ошибок.
# Подробности уходят владельцу в Telegram и в таблицу. Секреты в код не попадают
# вообще - они в GitHub Secrets, зашифрованы и в публичном репозитории не читаются.
name: tick

on:
  schedule:
    - cron: "23 * * * *"    # страховка раз в час. Не на нулевой минуте: дока
                            # называет начало часа пиком нагрузки Actions
  workflow_dispatch:        # кнопка «запустить сейчас» и вход эстафеты

# 🔴 Право дергать Actions нужно только последнему шагу - эстафете. Без него
# `gh workflow run` получит 403, цепочка оборвется молча, и это будет выглядеть
# как «сервис работает»: последний запуск зеленый, а следующего нет.
permissions:
  contents: read
  actions: write

# 🔴 Накладки запрещены. На этом стоит подбор зависших строк в tick.py:
# строка в статусе ПУБЛИКУЕТСЯ на входе в такт означает упавший прошлый такт,
# а не соседний работающий.
#
# С цепочкой это правило стало вдвойне нужным: эстафета и страховочный cron могут
# создать два запуска почти одновременно. Здесь они выстраиваются в очередь, а не
# идут внахлест, и очередь не растет: по доке новый ожидающий запуск вытесняет
# предыдущий ожидающий, так что больше одного звена про запас не накопится.
concurrency:
  group: foxlik-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 70     # 11 тактов по 5 минут плюс запас. Предел GitHub - 360
    steps:
      - uses: actions/checkout@v4
      # Шага установки Python нет: на ubuntu-latest он предустановлен.
      # Шага установки зависимостей нет: зависимостей у нас нет.

      # Проверки гоняются один раз на звено, а не перед каждым тактом:
      # код внутри часа не меняется.
      - name: Проверки перед работой
        run: |
          for m in http google_auth sheets drive telegram instagram vk cloudinary; do
            python3 -m lib.$m
          done
          python3 -m tests.test_tick
          python3 tests/test_workflow.py

      - name: Цепочка тактов
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          # 🔴 Чем публикуем с 31.08 (решение владельца 29.08). Пока этих двух строк
          # тут нет, такт в облаке работает вхолостую: приемка идет, эфира нет.
          POSTMYPOST_TOKEN: ${{ secrets.POSTMYPOST_TOKEN }}
          POSTMYPOST_PROJECT_ID: ${{ secrets.POSTMYPOST_PROJECT_ID }}
        run: |
          for i in $(seq 1 11); do
            echo "--- такт $i из 11 ---"
            # 🔴 Падение одного такта не должно рвать цепочку: следующая попытка
            # через 5 минут. Разбираться с причиной будет владелец по сообщению
            # в Telegram, а не остановившийся конвейер.
            python3 tick.py || echo "такт $i завершился с ошибкой, продолжаем"
            # 🔴 Страховка суточного замера. Его расписание 28.08 пропустило свой
            # срок и не запустилось вовсе, а замер на Д7 - основа петли: без него
            # не обновится словарь и не соберется следующая партия. Живая цепочка
            # надежнее cron, поэтому она заглядывает сюда каждый такт. Внутри
            # проверка отметки: работа делается раз в сутки, не чаще.
            python3 metrics.py --if-due || echo "страховка замера не отработала"
            if [ "$i" -lt 11 ]; then sleep 300; fi
          done

      # 🔴 always(): звено обязано передать эстафету, даже если такты падали.
      # Иначе одна ошибка гасит конвейер до следующего срабатывания cron,
      # а на cron мы, как замерено выше, положиться не можем.
      - name: Передать эстафету следующему звену
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run tick.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          echo "следующее звено поставлено в очередь"
